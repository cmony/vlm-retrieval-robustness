experiment:
  name: coco_val2017_full
  seed: 42
  output_dir: outputs/coco_val2017_full
data:
  image_dir: data/coco/val2017
  captions_json: data/coco/annotations/captions_val2017.json
  limit: 5000
  captions_per_image: 5
models:
- name: clip_vit_b32
  type: clip
  checkpoint: openai/clip-vit-base-patch32
- name: clip_vit_b16
  type: clip
  checkpoint: openai/clip-vit-base-patch16
- name: blip_base
  type: blip
  checkpoint: Salesforce/blip-itm-base-coco
- name: siglip_base
  type: siglip
  checkpoint: google/siglip-base-patch16-224
runtime:
  device: cuda
  precision: bf16
  image_batch_size: 256
  text_batch_size: 1024
  similarity_chunk_size: 512
  loader_workers: 8
statistics:
  bootstrap_repetitions: 5000
  confidence: 0.95
  seed: 2026
distortions:
  gaussian_noise:
    parameter: sigma
    values:
    - 0.05
    - 0.1
    - 0.2
    - 0.3
    repetitions: 3
  jpeg:
    parameter: quality
    values:
    - 80
    - 60
    - 40
    - 20
    repetitions: 1
  crop:
    parameter: ratio
    values:
    - 0.9
    - 0.8
    - 0.7
    - 0.6
    repetitions: 3
  brightness:
    parameter: factor
    values:
    - 0.6
    - 0.8
    - 1.2
    - 1.4
    repetitions: 1
  style:
    parameter: operation
    values:
    - grayscale
    - invert
    repetitions: 1
